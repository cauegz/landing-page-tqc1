<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page TQC1</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header id="cabecalho"></header>
    <section id="identidade-turma"></section>
    <section id="quem-somos"></section>
    <section id="integrantes"></section>
    <section id="mural"></section>
    <section id="linha-tempo">
      <div class="linha-tempo-header">
        <p class="subtitulo">TRAJETÓRIA</p>
        <h2>LINHA DO TEMPO</h2>
      </div>
      <div class="linha-tempo-container">
        <article class="timeline-item">
          <div class="icone-wrapper">
            <img src="caminho/icone-inicio.svg" alt="Início" />
          </div>
          <h3>Início</h3>
          <p>1 Jul 26</p>
        </article>

        <article class="timeline-item">
          <div class="icone-wrapper">
            <img
              src="caminho/icone-banco-dados.svg"
              alt="Challenge Banco de Dados"
            />
          </div>
          <h3>Challenge Banco de Dados</h3>
        </article>

        <!-- Item 3 -->
        <article class="timeline-item">
          <div class="icone-wrapper">
            <img src="caminho/icone-backend.svg" alt="Challenge Backend" />
          </div>
          <h3>Challenge Backend</h3>
        </article>

        <article class="timeline-item">
          <div class="icone-wrapper">
            <img src="caminho/icone-frontend.svg" alt="Challenge Frontend" />
          </div>
          <h3>Challenge Frontend</h3>
        </article>
      </div>
    </section>
    <footer id="rodape"></footer>
  </body>
</html>
